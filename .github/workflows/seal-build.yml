name: "Seal build"

# Authored for the sealed build: upstream builds and tests on Concourse (ci/pipeline.yml:
# Linux JDK 8 build, jdk11-build, jdk15-build, windows-build), not on GitHub Actions.
# Each job mirrors ci/scripts/build-project.sh (./gradlew --no-daemon --max-workers=4 ...),
# scoped to the spring-boot module (the published artifact) and spring-boot-actuator-autoconfigure
# (home of the security EndpointRequest classes).
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Gradle test task selector, e.g. ':spring-boot-project:spring-boot:test --tests FooTests'; empty runs the full suites"
        required: false
        default: ""

env:
  GRADLE_OPTS: -Dorg.gradle.internal.launcher.welcomeMessageEnabled=false

jobs:
  build:
    name: "Build jar + test (Linux, JDK 8)"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Prepare fork build (repo.spring.io is no longer anonymously readable)
        shell: bash
        run: bash .github/seal-prepare.sh
      - name: Build jar and run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew --no-daemon --max-workers=4 --console=plain --no-scan -I "$RUNNER_TEMP/test-results.gradle" \
              :spring-boot-project:spring-boot:jar ${{ inputs.test-filter }}
          else
            ./gradlew --no-daemon --max-workers=4 --console=plain --no-scan -I "$RUNNER_TEMP/test-results.gradle" \
              :spring-boot-project:spring-boot:jar \
              :spring-boot-project:spring-boot:test \
              :spring-boot-project:spring-boot-actuator-autoconfigure:test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: spring-boot-project/spring-boot/build/libs/spring-boot-2.3.6.RELEASE.jar
          if-no-files-found: error

  test:
    name: "Test (${{ matrix.os }}, JDK ${{ matrix.java }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "11"
            distribution: temurin
            tasks: ":spring-boot-project:spring-boot:test :spring-boot-project:spring-boot-actuator-autoconfigure:test"
          - os: ubuntu-latest
            java: "15"
            distribution: zulu
            tasks: ":spring-boot-project:spring-boot:test :spring-boot-project:spring-boot-actuator-autoconfigure:test"
          - os: windows-latest
            java: "8"
            distribution: temurin
            tasks: ":spring-boot-project:spring-boot:test"
    steps:
      # spring-boot-gradle-plugin test resources exceed Windows' 260-char MAX_PATH on checkout.
      - name: Enable long paths for git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Prepare fork build (repo.spring.io is no longer anonymously readable)
        shell: bash
        run: bash .github/seal-prepare.sh
      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew --no-daemon --max-workers=4 --console=plain --no-scan -I "$RUNNER_TEMP/test-results.gradle" \
              ${{ inputs.test-filter }}
          else
            ./gradlew --no-daemon --max-workers=4 --console=plain --no-scan -I "$RUNNER_TEMP/test-results.gradle" \
              ${{ matrix.tasks }}
          fi
